name: Prüfungen

# Bei Zweigen läuft nur der PR-Lauf, auf main der Push-Lauf – kein Doppellauf mehr.
# Ein neuer Push in denselben PR bricht den noch laufenden alten Lauf ab.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pruefungen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pruefungen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # fester Startwert (SEED=1), vier Prüfungen gleichzeitig
      - run: bash alle.sh
        env:
          JOBS: 4
